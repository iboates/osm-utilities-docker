services:

  postgis:
    # amd64-only image; emulated on arm64 runners. The binary under test
    # still runs natively, this is only its database peer.
    image: postgis/postgis:latest
    platform: linux/amd64
    environment:
      POSTGRES_DB: o2p
      POSTGRES_USER: o2p
      POSTGRES_PASSWORD: o2p
    volumes:
      - postgis_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  osm2pgsql:
    image: osm2pgsql:${VERSION}
    environment:
      PGPASSWORD: o2p
    volumes:
      - ./:/data

volumes:
  postgis_data: