version: '3.8'

services:

  postgis:
    # amd64-only image; emulated on arm64 runners. The binary under test
    # still runs natively, this is only its database peer.
    image: pgrouting/pgrouting:latest
    platform: linux/amd64
    environment:
      POSTGRES_DB: o2p
      POSTGRES_USER: o2p
      POSTGRES_PASSWORD: o2p
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/ and
      # refuse to start with a mount at the old /var/lib/postgresql/data path.
      - postgis_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  osm2pgrouting:
    image: osm2pgrouting:{{ version }}

volumes:
  postgis_data: